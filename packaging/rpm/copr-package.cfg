# COPR package configuration for connected-desktop
# This file is used by update-copr.sh to manage the COPR package

# COPR project name (user/project format)
COPR_PROJECT="paterkleomenis/connected"

# Chroots are read from the COPR project at build time, so newly branched
# Fedora releases are included automatically. If you wish to override this,
# uncomment the following line and set your own.
# COPR_CHROOTS="fedora-rawhide-x86_64 fedora-rawhide-aarch64"

# Architectures to build
ARCHITECTURES="x86_64 aarch64"
