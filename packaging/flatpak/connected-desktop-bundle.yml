# Self-hosted Flatpak bundle manifest (GitHub release bundles, built by
# .github/workflows/release.yml). Not the Flathub submission — for Flathub
# use io.github.paterkleomenis.Connected.yml. The differences: this one
# keeps --talk-name=org.freedesktop.Flatpak so in-app self-updates work
# (flatpak-spawn --host, see core/src/update.rs), doesn't set
# CONNECTED_FLATHUB_BUILD, and builds the checkout instead of a tag.
app-id: io.github.paterkleomenis.Connected
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: connected-desktop

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.mpris.MediaPlayer2.*
  - --own-name=org.mpris.MediaPlayer2.connected
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/connected/cargo

modules:
  - name: connected
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked -p connected-desktop
      - install -Dm755 target/release/connected-desktop /app/bin/connected-desktop
      - install -Dm644 packaging/flatpak/io.github.paterkleomenis.Connected.desktop /app/share/applications/io.github.paterkleomenis.Connected.desktop
      - install -Dm644 packaging/flatpak/io.github.paterkleomenis.Connected.metainfo.xml /app/share/metainfo/io.github.paterkleomenis.Connected.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.paterkleomenis.Connected.png /app/share/icons/hicolor/512x512/apps/io.github.paterkleomenis.Connected.png
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .flatpak-builder
          - build-dir
      - cargo-sources.json
